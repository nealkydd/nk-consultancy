  <script>
    // Karamba deck: arrows, keys, swipe, click left/right half, thumbnails. Instant swaps, no animation.
    (() => {
      const N = 20, img = document.getElementById('deck-slide'), count = document.getElementById('deck-count');
      const prev = document.getElementById('deck-prev'), next = document.getElementById('deck-next'), stage = document.getElementById('deck-stage');
      const thumbs = [...document.querySelectorAll('.deck-thumb')];
      const src = i => thumbs[i - 1].querySelector('img').getAttribute('src').replace('/thumb-', '/slide-');
      let i = Math.min(N, Math.max(1, parseInt(location.hash.slice(1), 10) || 1));
      const show = n => {
        i = Math.min(N, Math.max(1, n));
        img.src = src(i);
        const label = i === 2 ? 'Islands of Adventure Game Emblem' : i === 3 ? 'Karamba parrot adventurer cracking a leather whip' : 'Karamba slot game themes';
        img.alt = label + ', slide ' + i + ' of ' + N;
        count.textContent = String(i).padStart(2, '0') + ' / ' + N;
        prev.disabled = i === 1; next.disabled = i === N;
        thumbs.forEach((t, k) => t.setAttribute('aria-current', k + 1 === i ? 'true' : 'false'));
        thumbs[i - 1].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        history.replaceState(null, '', '#' + i);
        [i - 1, i + 1].forEach(k => { if (k >= 1 && k <= N) new Image().src = src(k); });
      };
      prev.addEventListener('click', () => show(i - 1));
      next.addEventListener('click', () => show(i + 1));
      thumbs.forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
      stage.addEventListener('click', e => { const r = stage.getBoundingClientRect(); show(e.clientX - r.left < r.width / 2 ? i - 1 : i + 1); });
      addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); });
      let x0 = null;
      stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) { e.preventDefault(); show(dx < 0 ? i + 1 : i - 1); } });
      show(i);
    })();
  </script>

    (() => { const d = document.querySelector('.nav-drop'); if (!d || !matchMedia('(hover: none)').matches) return;
      const top = d.querySelector(':scope > a');
      top.addEventListener('click', e => { if (!d.classList.contains('is-open')) { e.preventDefault(); d.classList.add('is-open'); } });
      document.addEventListener('click', e => { if (!d.contains(e.target)) d.classList.remove('is-open'); }); })();
