<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080809">
  <meta name="description" content="Rome — a photography series by NK Consultancy.">
  <title>Rome — Photography — NK Consultancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#080809;--paper:#f2efea;--gold:#d3b16c;--muted:#aaa8a3;--line:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:var(--paper);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(100% - 48px,1520px);margin:auto}.site-header{display:flex;min-height:94px;align-items:center;justify-content:space-between;gap:28px}.wordmark{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}.wordmark strong{margin-right:12px;color:#efd48e;font-size:18px;letter-spacing:-.08em}.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.nav a{display:inline-flex;min-height:34px;align-items:center;padding:0 13px;border:1px solid rgba(220,222,222,.25);border-radius:3px;background:rgba(47,49,51,.78);color:#e7e5e1;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.nav a:hover{border-color:rgba(239,212,142,.75);color:#fff}.intro{padding:88px 0 58px;border-top:1px solid var(--line)}.eyebrow{margin:0;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro h1{margin:18px 0 0;font-size:clamp(84px,18vw,260px);font-weight:700;letter-spacing:-.11em;line-height:.74;text-transform:uppercase}.project-meta{display:flex;justify-content:space-between;gap:24px;margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:#bbb8b1;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.hero-frame,.gallery-item{display:block;border:0;margin:0;padding:0;cursor:zoom-in;overflow:hidden;background:#242526}.hero-frame{width:100%;height:min(72vh,850px)}.hero-frame img,.gallery-item img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .35s ease}.hero-frame:hover img,.gallery-item:hover img{transform:scale(1.025)}.gallery{padding:18px 0 112px}.gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.image--wide{grid-column:2/span 10;aspect-ratio:1.34}.image--tall{grid-column:4/span 6;aspect-ratio:.78}.image--full{grid-column:1/-1;aspect-ratio:1.62}.image--half{grid-column:3/span 8;aspect-ratio:1.05}.gallery-note{grid-column:4/span 6;display:flex;min-height:220px;align-items:flex-end;padding:20px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1.55}.lightbox{width:min(calc(100vw - 40px),1600px);max-width:none;max-height:calc(100svh - 40px);overflow:hidden;margin:auto;padding:0;border:1px solid rgba(255,255,255,.18);background:#0c0d0e;box-shadow:0 32px 90px rgba(0,0,0,.75)}.lightbox::backdrop{background:rgba(4,4,5,.88);backdrop-filter:blur(5px)}.lightbox[open]{display:grid;place-items:center;animation:lightbox-in .28s cubic-bezier(.2,.8,.2,1)}.lightbox-image{display:block;max-width:100%;max-height:calc(100svh - 112px);object-fit:contain}.lightbox-close{position:absolute;z-index:2;top:12px;right:12px;display:grid;width:42px;height:42px;place-items:center;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(8,8,9,.72);color:#f4f1eb;font:500 24px/1 Inter,Arial,sans-serif;cursor:pointer}.lightbox-caption{position:absolute;right:18px;bottom:15px;left:18px;margin:0;color:#f5f2ec;font-size:10px;font-weight:700;letter-spacing:.15em;text-align:center;text-transform:uppercase}@keyframes lightbox-in{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:scale(1)}}.footer{background:#252729}.footer-ribbon{height:clamp(48px,4.2vw,66px);background:url('assets/purple-arc-footer.webp') center/cover no-repeat}.footer-legal{display:flex;min-height:72px;align-items:center;justify-content:space-between;gap:18px;color:#9b9ea2;font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase}.footer-legal a{color:#9b9ea2}.footer-legal a:hover{color:#e57a32}@media(max-width:760px){.shell{width:min(100% - 28px,1520px)}.site-header{align-items:flex-start;min-height:0;flex-direction:column;gap:13px;padding:22px 0}.nav{justify-content:flex-start}.intro{padding:68px 0 46px}.intro h1{font-size:clamp(72px,24vw,150px)}.project-meta{align-items:flex-start;flex-direction:column;margin-top:40px}.hero-frame{height:54vh}.gallery{padding-top:12px}.gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}.image--wide,.image--tall,.image--full,.image--half{grid-column:span 2;aspect-ratio:1.05}.gallery-note{grid-column:span 2;min-height:160px}.lightbox{width:calc(100vw - 20px);max-height:calc(100svh - 20px)}.lightbox-image{max-height:calc(100svh - 62px)}.footer-legal{align-items:flex-start;justify-content:center;flex-direction:column;padding:24px 0}}
    /* Full-resolution approved arc artwork: kept crisp in the footer ribbon. */
    .footer-ribbon{height:clamp(52px,4.5vw,70px);background-image:url('assets/purple-arc-footer-band.png');background-position:center;background-size:100% 100%;background-repeat:no-repeat}
    /* Quiet navigation: colour is reserved for the hover state. */
    .nav a{min-height:30px;padding:0 8px;border:0;background:transparent;color:#86898c;font-size:9px;letter-spacing:.15em;text-decoration:none;box-shadow:none}
    .nav a:hover,.nav a:focus-visible{border:0;background:transparent;color:#e57a32;text-decoration:none;outline:0}
    .footer-legal{color:#9b9ea2;font-size:10px;font-weight:400;letter-spacing:.16em}.footer-legal a{color:#9b9ea2}.footer-legal a:hover,.footer-legal a:focus-visible{color:#e57a32;outline:0}.footer-legal-links{display:flex;flex-wrap:wrap;gap:20px}
    /* The expanded image is never cropped or colour-adjusted. */
    .lightbox{width:100vw;height:100svh;max-height:none;margin:0;padding:64px 28px 52px;border:0;background:rgba(5,6,7,.965);box-shadow:none}
    .lightbox::backdrop{background:rgba(3,4,5,.9);backdrop-filter:blur(8px)}
    .lightbox[open]{display:grid;grid-template-rows:minmax(0,1fr) auto;place-items:center;animation:lightbox-backdrop .34s cubic-bezier(.2,.8,.2,1)}
    .lightbox-image{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transform:scale(.965);box-shadow:0 24px 80px rgba(0,0,0,.62);transition:opacity .5s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
    .lightbox.is-visible .lightbox-image{opacity:1;transform:scale(1)}
    .lightbox-caption{position:static;align-self:end;margin-top:16px;opacity:0;transform:translateY(8px);transition:opacity .4s .18s ease,transform .4s .18s ease}
    .lightbox.is-visible .lightbox-caption{opacity:1;transform:translateY(0)}
    .lightbox-close{top:18px;right:20px;opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .3s ease}
    .lightbox.is-visible .lightbox-close{opacity:1;transform:translateY(0)}
    .gallery-item{position:relative}.gallery-item::after{position:absolute;inset:0;content:"";pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 30%,rgba(0,0,0,.18));opacity:0;transition:opacity .3s ease}.gallery-item:hover::after,.gallery-item:focus-visible::after{opacity:1}
    @keyframes lightbox-backdrop{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.lightbox[open],.lightbox-image,.lightbox-caption,.lightbox-close,.gallery-item::after{animation:none;transition:none}}
  </style>
</head>
<body>
  <header class="shell site-header"><a class="wordmark" href="index.html"><strong>NK</strong>Consultancy</a><nav class="nav" aria-label="Primary navigation"><a href="work.html">Projects</a><a href="photography.html">Photography</a><a href="about.html">About</a><a href="mailto:hello@nakconsultancy.com">Contact</a></nav></header>
  <main>
    <section class="shell intro"><p class="eyebrow">Photography / 01</p><h1>Rome</h1><div class="project-meta"><span>City studies</span><span>2024</span><span>NK Consultancy</span></div></section>
    <button class="hero-frame" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_3840_webp/b136a7195843195.66152b996c2c7.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/b136a7195843195.66152b996c2c7.jpg" alt="Rome photography by NK Consultancy"></button>
    <section class="shell gallery" aria-label="Rome photography gallery"><div class="gallery-grid">
      <button class="gallery-item image--wide" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200_webp/3aa66a195843195.66152b996c74d.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200_webp/3aa66a195843195.66152b996c74d.jpg" alt="Rome photography"></button>
      <button class="gallery-item image--tall" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/hd_webp/0aec29195843195.66152ff4659e7.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/hd_webp/0aec29195843195.66152ff4659e7.jpg" alt="Rome photography"></button>
      <button class="gallery-item image--full" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_3840_webp/3bf3fb195843195.66152b996ce59.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/3bf3fb195843195.66152b996ce59.jpg" alt="Rome photography"></button>
      <button class="gallery-item image--half" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_3840_webp/59a3c4195843195.66152b996baa4.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/59a3c4195843195.66152b996baa4.jpg" alt="Rome photography"></button>
      <aside class="gallery-note">A quiet sequence of light, texture and architecture. The visual rhythm does the talking.</aside>
      <button class="gallery-item image--half" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_3840_webp/e5fe54195843195.66152b996b4b2.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/e5fe54195843195.66152b996b4b2.jpg" alt="Rome photography"></button>
      <button class="gallery-item image--full" type="button" aria-label="View Rome photograph full size"><img data-lightbox="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200_webp/efe61c195843195.66152ff4660c1.jpg" src="https://mir-s3-cdn-cf.behance.net/project_modules/max_1200_webp/efe61c195843195.66152ff4660c1.jpg" alt="Rome photography"></button>
    </div></section>
  </main>
  <footer class="footer"><div class="footer-ribbon" aria-hidden="true"></div><div class="shell footer-legal"><span>© 2026 NK Consultancy. All rights reserved.</span><nav class="footer-legal-links" aria-label="Footer information"><a href="resources.html">Resources</a><a href="policy.html">Policy</a></nav></div></footer>
  <dialog class="lightbox" aria-label="Expanded Rome photograph"><button class="lightbox-close" type="button" aria-label="Close expanded photograph">×</button><img class="lightbox-image" alt=""><p class="lightbox-caption">Rome / NK Consultancy</p></dialog>
  <script>
    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = lightbox.querySelector('.lightbox-image');
    const closeLightbox = () => {
      lightbox.classList.remove('is-visible');
      window.setTimeout(() => { if (lightbox.open) lightbox.close(); }, 180);
    };
    document.querySelectorAll('[data-lightbox]').forEach((image) => {
      image.closest('button').addEventListener('click', () => {
        lightbox.classList.remove('is-visible');
        lightboxImage.src = image.dataset.lightbox || image.currentSrc || image.src;
        lightboxImage.alt = image.alt;
        lightbox.showModal();
        requestAnimationFrame(() => lightbox.classList.add('is-visible'));
      });
    });
    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('cancel', (event) => { event.preventDefault(); closeLightbox(); });
  </script>
</body>
</html>
