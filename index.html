<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080809">
  <meta name="description" content="NK Consultancy — craft with clarity of purpose.">
  <title>NK Consultancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#080809;--gold:#d3b16c;--gold-light:#efd48e}
    *{box-sizing:border-box}html,body{margin:0;background:var(--black);color:#f4f1eb;font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}
    .shell{width:min(100% - 48px,1600px);margin:auto}
    .site-header{position:absolute;z-index:10;inset:0 0 auto;display:flex;min-height:94px;align-items:center;justify-content:space-between;gap:28px}
    .wordmark{color:#f1eee9;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}.wordmark strong{margin-right:12px;color:var(--gold-light);font-size:18px;letter-spacing:-.08em}
    .nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.nav a{display:inline-flex;min-height:34px;align-items:center;padding:0 13px;border:1px solid rgba(220,222,222,.25);border-radius:3px;background:rgba(47,49,51,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);color:#e7e5e1;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:.2s ease}.nav a:hover{border-color:rgba(239,212,142,.75);background:rgba(72,74,76,.92);color:#fff}
    .hero{position:relative;display:grid;min-height:100svh;place-items:center;overflow:hidden;isolation:isolate;background:var(--black)}.hero::before{position:absolute;z-index:-2;inset:0;content:"";background:url('assets/nk-marble-splash-matte.webp') center/cover no-repeat;filter:saturate(.78) contrast(1.04)}.hero::after{position:absolute;z-index:-1;inset:0;content:"";background:linear-gradient(180deg,rgba(5,5,6,.22) 0%,transparent 27%,rgba(5,5,6,.12) 55%,rgba(8,8,9,.7) 80%,var(--black) 100%)}
    .hero-content{display:flex;width:min(100% - 48px,660px);min-height:100svh;align-items:center;justify-content:center;flex-direction:column;padding:128px 0 92px;text-align:center}
    .logo-plaque{display:grid;width:clamp(290px,31vw,445px);aspect-ratio:.89;place-items:center;padding:8%;border:1px solid rgba(231,233,231,.22);border-radius:8px;background:linear-gradient(135deg,rgba(47,49,52,.92),rgba(16,17,19,.97) 70%);box-shadow:0 28px 56px rgba(0,0,0,.62),inset 0 1px 1px rgba(255,255,255,.15),inset 0 -16px 28px rgba(0,0,0,.34)}.logo-plaque img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.32))}
    .craft-lockup{margin-top:34px}.craft{margin:0;padding-left:.28em;color:var(--gold-light);font-size:clamp(34px,4.4vw,64px);font-weight:500;letter-spacing:.28em;line-height:1;text-transform:uppercase}.purpose{margin:16px 0 0;color:#d6d2cb;font-size:clamp(15px,1.45vw,20px);font-style:italic;font-weight:500;letter-spacing:.01em}
    .footer{position:relative;min-height:260px;overflow:hidden;background:var(--black)}.footer::before{position:absolute;inset:0;content:"";background:linear-gradient(90deg,var(--black) 0%,rgba(8,8,9,.78) 39%,rgba(8,8,9,.47)),url('assets/nk-marble-splash-matte.webp') center/cover;opacity:.62}.footer-plum{position:absolute;inset:0 auto 0 0;width:min(44vw,660px);background:linear-gradient(90deg,rgba(8,8,9,.06),rgba(8,8,9,.48)),url('assets/purple-arc-footer.webp') center/cover;opacity:.84}.footer-inner{position:relative;display:flex;min-height:260px;align-items:center;justify-content:space-between;gap:32px}.footer-name{margin:0;color:#f1eee9;font-size:clamp(22px,2.6vw,34px);font-weight:700;letter-spacing:.05em;text-transform:uppercase}.footer-copy{margin:10px 0 0;color:#b8b4ae;font-size:14px}.footer-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:20px;color:var(--gold-light);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.footer-links a{padding-bottom:5px;border-bottom:1px solid rgba(239,212,142,.62)}
    @media(max-width:760px){.shell{width:min(100% - 28px,1600px)}.site-header{min-height:0;align-items:flex-start;flex-direction:column;gap:13px;padding:22px 0}.nav{justify-content:flex-start}.hero-content{width:min(100% - 28px,660px);padding:150px 0 72px}.logo-plaque{width:min(79vw,390px)}.footer{min-height:300px}.footer-plum{width:88vw;opacity:.58}.footer-inner{min-height:300px;align-items:flex-start;justify-content:center;flex-direction:column;padding:44px 0}.footer-links{justify-content:flex-start}}
  </style>
</head>
<body>
  <header class="shell site-header">
    <a class="wordmark" href="#top"><strong>NK</strong>Consultancy</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="https://quantaflexmedia.com/" target="_blank" rel="noreferrer">QuantaFlex</a>
      <a href="https://play.google.com/store/apps/details?id=com.astroqabalah.treereader" target="_blank" rel="noreferrer">Tree Reader</a>
      <a href="about.html">About</a>
      <a href="mailto:hello@nakconsultancy.com">Contact</a>
    </nav>
  </header>
  <main>
    <section class="hero" id="top" aria-labelledby="craft-title">
      <div class="hero-content">
        <div class="logo-plaque"><img src="assets/nk-consultancy-transparent.webp" alt="NK Consultancy"></div>
        <div class="craft-lockup"><h1 class="craft" id="craft-title">Craft</h1><p class="purpose">with clarity of purpose</p></div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-plum" aria-hidden="true"></div>
    <div class="shell footer-inner">
      <div><p class="footer-name">NK Consultancy</p><p class="footer-copy">Craft, with clarity of purpose.</p></div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="https://quantaflexmedia.com/" target="_blank" rel="noreferrer">QuantaFlex</a>
        <a href="https://play.google.com/store/apps/details?id=com.astroqabalah.treereader" target="_blank" rel="noreferrer">Tree Reader</a>
        <a href="mailto:hello@nakconsultancy.com">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
