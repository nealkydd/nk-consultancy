<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#221241">
  <meta name="description" content="NK Consultancy - product, brand and digital experiences.">
  <title>NK Consultancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0a0a0b; --panel:#121214; --gold:#d3b16c; --gold-light:#efd48e; --muted:#aaa49a; --line:rgba(211,177,108,.42); --plum:#2f0752; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--ink); color:#f4f1eb; font-family:Inter,Arial,sans-serif; font-size:16px; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(100% - 44px, 1600px); margin:auto; }
    .site-header { height:82px; display:flex; align-items:center; justify-content:space-between; gap:30px; position:absolute; z-index:2; left:0; right:0; color:#eee9df; }
    .brand { letter-spacing:.18em; text-transform:uppercase; font-size:13px; font-weight:700; white-space:nowrap; }
    .brand b { color:var(--gold-light); font-size:22px; letter-spacing:-.09em; margin-right:14px; }
    .nav { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:30px; font-size:11px; font-weight:700; letter-spacing:.19em; text-transform:uppercase; }
    .nav a { opacity:.8; transition:opacity .2s,color .2s; }.nav a:hover{opacity:1;color:var(--gold-light)}
    .hero { min-height:100svh; position:relative; display:grid; place-items:center; overflow:hidden; background:#080808; }
    .hero::before { content:""; position:absolute; inset:0; background:url('assets/nk-marble-splash-matte.webp') center/cover; filter:saturate(.74) contrast(1.04); }
    .hero::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center,rgba(0,0,0,.08),rgba(0,0,0,.4) 78%),linear-gradient(180deg,rgba(0,0,0,.32),transparent 36%,rgba(0,0,0,.56)); }
    .hero-inner { position:relative; z-index:1; width:min(100% - 44px,1120px); text-align:center; padding:136px 0 96px; }
    .logo-plaque { display:grid; place-items:center; width:clamp(300px,29vw,440px); aspect-ratio:.89; margin:0 auto; padding:8%; background:linear-gradient(135deg,rgba(18,19,21,.58),rgba(12,13,15,.78)),url('assets/nk-marble-splash-matte.webp') 53% 48%/290% auto; border:1px solid rgba(226,229,228,.25); border-radius:7px; box-shadow:0 26px 52px rgba(0,0,0,.62),inset 0 1px 1px rgba(255,255,255,.15),inset 0 -14px 24px rgba(0,0,0,.36); }
    .hero-logo { display:block; width:100%; margin:0 auto; filter:drop-shadow(0 13px 18px rgba(0,0,0,.3)); }
    .craft-lockup { margin:28px auto 0; }
    .craft { margin:0; padding-left:.28em; color:var(--gold-light); font-size:clamp(38px,4.7vw,68px); font-weight:500; letter-spacing:.28em; line-height:1; text-transform:uppercase; }
    .purpose { margin:20px 0 0; color:#d7d0c2; font-size:clamp(15px,1.55vw,21px); font-style:italic; font-weight:500; letter-spacing:.01em; line-height:1.35; }
    @media (max-width:900px){.site-header{height:auto;padding:24px 0;align-items:flex-start}.nav{gap:15px;max-width:58%}.hero{min-height:100svh}}
    @media (max-width:580px){.shell{width:min(100% - 28px,1600px)}.site-header{position:relative}.hero{min-height:calc(100svh - 88px)}.hero-inner{padding-top:74px;width:min(100% - 28px,1120px)}.logo-plaque{width:min(82vw,360px)}.craft-lockup{margin-top:24px}.craft{font-size:clamp(30px,10vw,48px);letter-spacing:.24em;padding-left:.24em}.purpose{font-size:15px}.nav{max-width:none;justify-content:flex-start}.nav a{font-size:9px}}
  </style>
</head>
<body>
  <header class="shell site-header"><a class="brand" href="#top"><b>NK</b> Consultancy</a><nav class="nav" aria-label="Primary"><a href="https://quantaflexmedia.com/" target="_blank" rel="noreferrer">QuantaFlex</a><a href="https://play.google.com/store/apps/details?id=com.astroqabalah.treereader" target="_blank" rel="noreferrer">Tree Reader</a><a href="about.html">About</a><a href="mailto:hello@nakconsultancy.com">Contact</a></nav></header>
  <section class="hero" id="top"><div class="hero-inner"><div class="logo-plaque"><img class="hero-logo" src="assets/nk-consultancy-transparent.webp" alt="NK Consultancy"></div><div class="craft-lockup"><p class="craft">CRAFT</p><p class="purpose">with clarity of purpose</p></div></div></section>
</body>
</html>
