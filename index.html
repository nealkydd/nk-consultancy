<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#221241">
  <meta name="description" content="NK Consultancy - product, brand and digital experiences.">
  <title>NK Consultancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0a0a0b; --panel:#121214; --gold:#d3b16c; --gold-light:#efd48e; --muted:#aaa49a; --line:rgba(211,177,108,.42); --plum:#2f0752; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--ink); color:#f4f1eb; font-family:Inter,Arial,sans-serif; font-size:16px; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(100% - 44px, 1600px); margin:auto; }
    .site-header { height:82px; display:flex; align-items:center; justify-content:space-between; gap:30px; position:absolute; z-index:2; left:0; right:0; color:#eee9df; }
    .brand { letter-spacing:.18em; text-transform:uppercase; font-size:13px; font-weight:700; white-space:nowrap; }
    .brand b { color:var(--gold-light); font-size:22px; letter-spacing:-.09em; margin-right:14px; }
    .nav { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:30px; font-size:11px; font-weight:700; letter-spacing:.19em; text-transform:uppercase; }
    .nav a { opacity:.8; transition:opacity .2s,color .2s; }.nav a:hover{opacity:1;color:var(--gold-light)}
    .hero { min-height:100svh; position:relative; display:grid; place-items:center; overflow:hidden; background:#080808; }
    .hero::before { content:""; position:absolute; inset:0; background:url('assets/nk-marble-framed-hero-logo.webp') center/cover; filter:saturate(.82) contrast(1.03); }
    .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.16),transparent 36%,rgba(0,0,0,.18) 64%,rgba(8,8,9,.84) 88%,#080809 100%); }
    .hero-inner { position:relative; z-index:1; display:flex; min-height:100svh; width:min(100% - 44px,1120px); align-items:center; justify-content:flex-end; flex-direction:column; text-align:center; padding:136px 0 48px; }
    .craft-lockup { margin:0 auto; }
    .craft { margin:0; padding-left:.28em; color:var(--gold-light); font-size:clamp(38px,4.7vw,68px); font-weight:500; letter-spacing:.28em; line-height:1; text-transform:uppercase; }
    .purpose { margin:20px 0 0; color:#d7d0c2; font-size:clamp(15px,1.55vw,21px); font-style:italic; font-weight:500; letter-spacing:.01em; line-height:1.35; }
    .footer { position:relative; min-height:250px; overflow:hidden; background:#080809; }
    .footer::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#080809 0%,rgba(8,8,9,.82) 36%,rgba(8,8,9,.6)),url('assets/nk-marble-splash-matte.webp') center/cover; opacity:.58; }
    .footer-plum { position:absolute; inset:0 auto 0 0; width:min(45vw,650px); background:linear-gradient(90deg,rgba(8,8,9,.1),rgba(8,8,9,.46)),url('assets/purple-arc-footer.webp') center/cover; opacity:.8; }
    .footer-inner { position:relative; z-index:1; min-height:250px; display:flex; align-items:center; justify-content:space-between; gap:28px; }
    .footer-mark { margin:0; color:#eee9df; font-size:clamp(21px,2.8vw,34px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .footer-copy { margin:10px 0 0; color:#bab4ac; font-size:14px; line-height:1.5; }
    .footer-links { display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:flex-end; color:var(--gold-light); font-size:11px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
    .footer-links a { border-bottom:1px solid rgba(239,212,142,.62); padding-bottom:5px; }
    @media (max-width:900px){.site-header{height:auto;padding:24px 0;align-items:flex-start}.nav{gap:15px;max-width:58%}.hero{min-height:100svh}}
    @media (max-width:580px){.shell{width:min(100% - 28px,1600px)}.site-header{position:relative}.hero{min-height:calc(100svh - 88px)}.hero-inner{min-height:calc(100svh - 88px);padding:74px 0 34px;width:min(100% - 28px,1120px)}.craft{font-size:clamp(30px,10vw,48px);letter-spacing:.24em;padding-left:.24em}.purpose{font-size:15px}.nav{max-width:none;justify-content:flex-start}.nav a{font-size:9px}.footer{min-height:280px}.footer-plum{width:88vw;opacity:.55}.footer-inner{min-height:280px;align-items:flex-start;justify-content:center;flex-direction:column;padding:46px 0}.footer-links{justify-content:flex-start}}
  </style>
</head>
<body>
  <header class="shell site-header"><a class="brand" href="#top"><b>NK</b> Consultancy</a><nav class="nav" aria-label="Primary"><a href="https://quantaflexmedia.com/" target="_blank" rel="noreferrer">QuantaFlex</a><a href="https://play.google.com/store/apps/details?id=com.astroqabalah.treereader" target="_blank" rel="noreferrer">Tree Reader</a><a href="about.html">About</a><a href="mailto:hello@nakconsultancy.com">Contact</a></nav></header>
  <section class="hero" id="top"><div class="hero-inner"><div class="craft-lockup"><p class="craft">CRAFT</p><p class="purpose">with clarity of purpose</p></div></div></section>
  <footer class="footer"><div class="footer-plum" aria-hidden="true"></div><div class="shell footer-inner"><div><p class="footer-mark">NK Consultancy</p><p class="footer-copy">Craft, with clarity of purpose.</p></div><nav class="footer-links" aria-label="Footer"><a href="https://quantaflexmedia.com/" target="_blank" rel="noreferrer">QuantaFlex</a><a href="https://play.google.com/store/apps/details?id=com.astroqabalah.treereader" target="_blank" rel="noreferrer">Tree Reader</a><a href="mailto:hello@nakconsultancy.com">Contact</a></nav></div></footer>
</body>
</html>
